name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 6 * * 1'  # Jeden Montag um 06:00 UTC

jobs:
  analyze:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-and-quality

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results

      - name: Generate alerts CSV from SARIF
        if: always()
        run: |
          python3 -c "
          import json, csv, glob

          sarif_files = glob.glob('sarif-results/*.sarif')
          rows = []
          for f in sarif_files:
              data = json.load(open(f))
              for run in data.get('runs', []):
                  rules = {r['id']: r for r in run.get('tool',{}).get('driver',{}).get('rules',[])}
                  for result in run.get('results', []):
                      rule_id = result.get('ruleId','')
                      rule = rules.get(rule_id, {})
                      loc = result.get('locations',[{}])[0].get('physicalLocation',{})
                      file_path = loc.get('artifactLocation',{}).get('uri','')
                      line = loc.get('region',{}).get('startLine','')
                      rows.append({
                          'Rule ID': rule_id,
                          'Severity': result.get('level',''),
                          'Message': result.get('message',{}).get('text',''),
                          'File': file_path,
                          'Line': line,
                          'Rule Name': rule.get('shortDescription',{}).get('text',''),
                          'Tags': '; '.join(rule.get('properties',{}).get('tags',[]))
                      })

          with open('codeql-alerts.csv', 'w', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=['Rule ID','Severity','Message','File','Line','Rule Name','Tags'])
              writer.writeheader()
              writer.writerows(rows)
          print(f'{len(rows)} alerts written to codeql-alerts.csv')
          "

      - name: Upload alerts CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-alerts-csv
          path: codeql-alerts.csv
          retention-days: 30
